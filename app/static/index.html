<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>WoonSupport</title><link rel="stylesheet" href="/static/styles.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script defer src="/static/app.js"></script></head>
<body><main class="shell"><header class="top"><div class="logo">W</div><div><p class="eyebrow">MINECRAFT SUPPORT</p><h1>WoonSupport</h1></div></header>
<section class="card welcome"><p class="eyebrow">ЦЕНТР ОБРАЩЕНИЙ</p><h2 id="greeting">Привет!</h2><p class="muted">Подавай апелляции и следи за их статусом.</p><div id="identity" class="identity">Проверяем Telegram…</div></section>
<nav class="tabs"><button class="tab active" data-view="appeals">Мои заявки</button><button class="tab" data-view="new">Подать заявку</button><button class="tab staff-only hidden" data-view="moderation">Модерация</button><button class="tab admin-only hidden" data-view="admin">Статистика</button></nav>
<section id="view-appeals" class="view card"><div class="section-heading"><div><p class="eyebrow">ИСТОРИЯ</p><h2>Мои заявки</h2></div><button id="refresh" class="quiet">Обновить</button></div><div id="appeal-list" class="stack"><p class="muted">Загружаем…</p></div></section>
<section id="view-new" class="view card hidden"><p class="eyebrow">НОВОЕ ОБРАЩЕНИЕ</p><h2>Апелляция бана</h2><form id="appeal-form" class="stack"><label>Ник в Minecraft<input name="minecraft_nickname" required minlength="2" maxlength="32" pattern="[A-Za-z0-9_]+" placeholder="YourNickname"></label><label>Причина бана<textarea name="ban_reason" required minlength="2" maxlength="500" rows="3"></textarea></label><label>Почему бан стоит пересмотреть?<textarea name="appeal_text" required minlength="10" maxlength="5000" rows="5"></textarea></label><label>Ссылки на доказательства<textarea name="evidence" rows="2" placeholder="HTTPS-ссылка на каждой строке"></textarea></label><button class="primary" type="submit">Отправить апелляцию</button><p id="form-message" class="muted" role="status"></p></form></section>
<section id="view-moderation" class="view card hidden"><p class="eyebrow">КОМАНДА</p><h2>Очередь заявок</h2><div class="filters"><select id="status-filter"><option value="">Все статусы</option><option value="pending">Новые</option><option value="in_review">На рассмотрении</option><option value="need_info">Нужны данные</option><option value="approved">Одобрены</option><option value="rejected">Отклонены</option></select><input id="search" placeholder="Ник или номер"></div><div id="moderation-list" class="stack"></div></section>
<section id="view-admin" class="view card hidden"><p class="eyebrow">ОБЗОР</p><h2>Статистика</h2><div id="stats" class="stack"></div></section><footer>WoonSupport · Центр поддержки</footer><div id="toast" class="toast hidden" role="status"></div></main></body></html>
